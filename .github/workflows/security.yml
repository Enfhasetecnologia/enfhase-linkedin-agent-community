name: Native security tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native-security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Native helper regression tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m unittest discover -s tests -v
          python3 tools/verify_distribution.py
      - name: Rebuild distribution from reviewed sources
        run: |
          python3 tools/build_public_distribution.py
          python3 dist/public-candidate/tools/verify_distribution.py
